<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEWS・お知らせ｜株式会社レンビス（RENVIS）</title><meta name="description" content="株式会社レンビスの休業案内、営業情報、最新のお知らせをご案内します。"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07090c;color:#f4f6f8;font-family:"Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.8}a{color:inherit;text-decoration:none}.wrap{width:min(1050px,calc(100% - 32px));margin:auto}.top{border-bottom:1px solid #31343b;background:#0b1017}.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0}.logo{font-size:1.55rem;font-weight:900;letter-spacing:.12em}.top small{display:block;font-size:.6rem;font-weight:500;letter-spacing:.14em}.back{color:#dfc27a;font-size:.78rem}.hero{padding:76px 0 45px;background:linear-gradient(145deg,#141c27,#080b11)}.eyebrow{color:#d8b65a;letter-spacing:.22em;font-size:.73rem;font-weight:700}h1{font-size:clamp(2.5rem,5vw,4rem);margin:2px 0 8px;line-height:1.2}.muted{color:#aab4c0;font-size:.88rem}.list{padding:38px 0 95px}.item{display:grid;grid-template-columns:115px 105px 1fr 20px;align-items:center;gap:15px;border-bottom:1px solid #333b43;min-height:82px;padding:16px 4px}.item:first-child{border-top:1px solid #333b43}.item:hover{background:#141a22}.date{color:#b1bcc8;font-size:.78rem}.cat{color:#e3c579;border:1px solid #816d49;font-size:.72rem;padding:4px 8px;text-align:center}.title{font-size:.96rem;font-weight:650}.arrow{color:#d8b65a}article{padding:44px 0 95px;max-width:850px}article h2{font-size:clamp(1.5rem,3vw,2.4rem);line-height:1.4;margin:19px 0 30px}article p{margin:0 0 21px;white-space:pre-line;line-height:2.1;color:#e1e5e9}article .meta{display:flex;align-items:center;gap:15px}footer{border-top:1px solid #252b32;padding:28px 0;color:#8b949e;font-size:.75rem}@media(max-width:760px){.item{grid-template-columns:92px 1fr 15px;gap:8px 10px}.title{grid-column:1/3;grid-row:2;font-size:.87rem}.arrow{grid-column:3;grid-row:1/3}.date{font-size:.7rem}.cat{justify-self:start;font-size:.65rem}}
</style><script src="news-data.js" defer></script></head><body><header class="top"><div class="wrap"><a href="index.html" class="logo">RENVIS<small>株式会社レンビス</small></a><a href="index.html" class="back">← トップページへ戻る</a></div></header><div class="hero"><div class="wrap"><div class="eyebrow">INFORMATION</div><h1>NEWS</h1><div class="muted">お知らせ・最新情報</div></div></div><main class="wrap"><div id="newsContent" class="list"></div></main><footer><div class="wrap">© RENVIS Co., Ltd. All Rights Reserved.</div></footer><script>
document.addEventListener('DOMContentLoaded',()=>{const el=document.getElementById('newsContent');const posts=(window.RENVIS_NEWS||[]).filter(p=>p.published!==false).sort((a,b)=>b.date.localeCompare(a.date));const id=new URLSearchParams(location.search).get('id');const item=id&&posts.find(p=>p.id===id);const date=p=>p.date.replaceAll('-','.');function node(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!==undefined)n.textContent=content;return n;}if(item){el.className='';const article=node('article');const meta=node('div','meta');const t=node('time','date',date(item));t.dateTime=item.date;meta.append(t,node('span','cat',item.category));article.append(meta,node('h2','',item.title));for(const p of item.paragraphs)article.append(node('p','',p));const back=node('a','back','← お知らせ一覧に戻る');back.href='news.html';article.append(back);el.append(article);document.title=item.title+'｜株式会社レンビス';return;}if(id){el.append(node('p','muted','指定のお知らせは公開されていないか、見つかりません。'));const back=node('a','back','お知らせ一覧を見る →');back.href='news.html';el.append(back);return;}if(!posts.length){el.append(node('p','muted','現在、お知らせはありません。'));return;}for(const p of posts){const a=node('a','item');a.href='news.html?id='+encodeURIComponent(p.id);const t=node('time','date',date(p));t.dateTime=p.date;a.append(t,node('span','cat',p.category),node('span','title',p.title),node('span','arrow','›'));el.append(a);}});
</script></body></html>
