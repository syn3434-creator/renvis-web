<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEWS・お知らせ｜株式会社レンビス（RENVIS）</title><meta name="description" content="株式会社レンビスの休業案内、営業情報、最新のお知らせをご案内します。"><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07090c;color:#f4f6f8;font-family:"Noto Sans JP","Yu Gothic",system-ui,sans-serif;line-height:1.8}a{color:inherit;text-decoration:none}.wrap{width:min(1050px,calc(100% - 32px));margin:auto}.top{border-bottom:1px solid #31343b;background:#0b1017}.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0}.logo{font-size:1.55rem;font-weight:900;letter-spacing:.12em}.top small{display:block;font-size:.6rem;font-weight:500;letter-spacing:.14em}.back{color:#dfc27a;font-size:.78rem}.hero{padding:76px 0 45px;background:linear-gradient(145deg,#141c27,#080b11)}.eyebrow{color:#d8b65a;letter-spacing:.22em;font-size:.73rem;font-weight:700}h1{font-size:clamp(2.5rem,5vw,4rem);margin:2px 0 8px;line-height:1.2}.muted{color:#aab4c0;font-size:.88rem}.list{padding:38px 0 95px}.item{display:grid;grid-template-columns:115px 105px 1fr 20px;align-items:center;gap:15px;border-bottom:1px solid #333b43;min-height:82px;padding:16px 4px}.item:first-child{border-top:1px solid #333b43}.item:hover{background:#141a22}.date{color:#b1bcc8;font-size:.78rem}.cat{color:#e3c579;border:1px solid #816d49;font-size:.72rem;padding:4px 8px;text-align:center}.title{font-size:.96rem;font-weight:650}.arrow{color:#d8b65a}article{padding:44px 0 95px;max-width:850px}article h2{font-size:clamp(1.5rem,3vw,2.4rem);line-height:1.4;margin:19px 0 30px}article p{margin:0 0 21px;white-space:pre-line;line-height:2.1;color:#e1e5e9}article .meta{display:flex;align-items:center;gap:15px}footer{border-top:1px solid #252b32;padding:28px 0;color:#8b949e;font-size:.75rem}@media(max-width:760px){.item{grid-template-columns:92px 1fr 15px;gap:8px 10px}.title{grid-column:1/3;grid-row:2;font-size:.87rem}.arrow{grid-column:3;grid-row:1/3}.date{font-size:.7rem}.cat{justify-self:start;font-size:.65rem}}

/* RENVIS business calendar (NEWS article only) */
.business-calendar{border:1px solid #343e49;background:#0d131b;padding:24px;margin:24px 0 28px;max-width:700px}
.business-calendar h3{font-size:1.2rem;letter-spacing:.04em;margin:0 0 12px}
.business-calendar .legend{display:flex;gap:16px;flex-wrap:wrap;color:#ccd5dd;font-size:.78rem;margin-bottom:16px}
.business-calendar .legend span{display:inline-flex;align-items:center;gap:7px}
.business-calendar .dot{display:inline-block;width:10px;height:10px;border-radius:2px;background:#d8b65a}
.business-calendar .dot.closed{background:#d86767}
.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.calendar-cell{min-width:0;aspect-ratio:1.06;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #29333e;background:#17202a;color:#f4f6f8;font-weight:700;font-variant-numeric:tabular-nums;font-size:1rem}
.calendar-cell.heading{aspect-ratio:auto;min-height:30px;border:0;background:transparent;color:#aeb9c5;font-size:.73rem}
.calendar-cell.heading:first-child{color:#ec9191}.calendar-cell.heading:last-child{color:#93b8e8}
.calendar-cell.empty{background:transparent;border-color:transparent}
.calendar-cell.closed{background:#43232a;border-color:#8d424d;color:#ffb6b6}
.calendar-cell small{font-size:.55rem;font-weight:600;line-height:1.2;margin-top:3px;text-align:center}
.calendar-foot{margin-top:12px;color:#b6c0ca;font-size:.73rem;line-height:1.8}
@media(max-width:760px){.business-calendar{padding:13px;margin:17px 0 25px}.calendar-grid{gap:3px}.calendar-cell{font-size:.87rem;aspect-ratio:.92}.calendar-cell small{font-size:.42rem}.business-calendar h3{font-size:1rem}}
</style><script src="news-data.js" defer></script></head><body><header class="top"><div class="wrap"><a href="index.html" class="logo">RENVIS<small>株式会社レンビス</small></a><a href="index.html" class="back">← トップページへ戻る</a></div></header><div class="hero"><div class="wrap"><div class="eyebrow">INFORMATION</div><h1>NEWS</h1><div class="muted">お知らせ・最新情報</div></div></div><main class="wrap"><div id="newsContent" class="list"></div></main><footer><div class="wrap">© RENVIS Co., Ltd. All Rights Reserved.</div></footer><script>
document.addEventListener('DOMContentLoaded',()=>{const el=document.getElementById('newsContent');const posts=(window.RENVIS_NEWS||[]).filter(p=>p.published!==false).sort((a,b)=>b.date.localeCompare(a.date));const id=new URLSearchParams(location.search).get('id');const item=id&&posts.find(p=>p.id===id);const date=p=>p.date.replaceAll('-','.');function node(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!==undefined)n.textContent=content;return n;}if(item){el.className='';const article=node('article');const meta=node('div','meta');const t=node('time','date',date(item));t.dateTime=item.date;meta.append(t,node('span','cat',item.category));article.append(meta,node('h2','',item.title));for(const p of item.paragraphs)article.append(node('p','',p));
if(item.calendar){
 const cal=item.calendar, year=Number(cal.year), month=Number(cal.month);
 if(Number.isInteger(year)&&month>=1&&month<=12){
  const wrap=node('section','business-calendar');wrap.setAttribute('aria-label',`${year}年${month}月の営業カレンダー`);
  wrap.append(node('h3','',`${year}年${month}月 営業カレンダー`));
  const legend=node('div','legend');legend.innerHTML='<span><i class="dot"></i>営業日</span><span><i class="dot closed"></i>休業日</span>';wrap.append(legend);
  const grid=node('div','calendar-grid');for(const w of ['日','月','火','水','木','金','土'])grid.append(node('div','calendar-cell heading',w));
  const offset=new Date(year,month-1,1).getDay(),last=new Date(year,month,0).getDate();
  for(let i=0;i<offset;i++)grid.append(node('div','calendar-cell empty'));
  const closed=new Set(cal.closedDays||[]);
  for(let d=1;d<=last;d++){const cell=node('div','calendar-cell'+(closed.has(d)?' closed':''),String(d));const note=cal.notes?.[String(d)];if(note)cell.append(node('small','',note));cell.setAttribute('aria-label',`${month}月${d}日 ${closed.has(d)?'休業日':'営業日'}${note?' '+note:''}`);grid.append(cell);}
  wrap.append(grid,node('div','calendar-foot','赤色：休業日（日曜・祝日・第2・第4土曜）'));article.append(wrap);
 }
}
const back=node('a','back','← お知らせ一覧に戻る');back.href='news.html';article.append(back);el.append(article);document.title=item.title+'｜株式会社レンビス';return;}if(id){el.append(node('p','muted','指定のお知らせは公開されていないか、見つかりません。'));const back=node('a','back','お知らせ一覧を見る →');back.href='news.html';el.append(back);return;}if(!posts.length){el.append(node('p','muted','現在、お知らせはありません。'));return;}for(const p of posts){const a=node('a','item');a.href='news.html?id='+encodeURIComponent(p.id);const t=node('time','date',date(p));t.dateTime=p.date;a.append(t,node('span','cat',p.category),node('span','title',p.title),node('span','arrow','›'));el.append(a);}});
</script></body></html>
