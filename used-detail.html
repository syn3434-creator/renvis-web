<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中古商品詳細 | RENVIS</title>
<style>
:root{--bg:#07090c;--panel:#10151c;--text:#f4f6f8;--muted:#a5adb7;--line:rgba(255,255,255,.14);--blue:#197aca}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP","Yu Gothic",system-ui,sans-serif}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}.wrap{width:min(1180px,calc(100% - 48px));margin:auto}header{height:78px;display:flex;align-items:center;border-bottom:1px solid var(--line);background:#080a0d}.head{display:flex;align-items:center;justify-content:space-between}.logo{width:250px;mix-blend-mode:screen}.back{border:1px solid var(--line);padding:10px 15px;font-size:.8rem}main{padding:62px 0 90px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:54px}.visual{background:linear-gradient(135deg,#171d25,#090c10);border:1px solid var(--line);min-height:500px;display:grid;place-items:center}.visual img{width:100%;height:100%;max-height:620px;object-fit:cover}.no-photo{color:#77818d;letter-spacing:.15em}.eyebrow{color:#aeb6c0;letter-spacing:.16em;font-size:.74rem}h1{font-size:clamp(2.3rem,5vw,4.8rem);margin:10px 0 18px;line-height:1}.status{display:inline-block;border:1px solid #35c77b;color:#35c77b;padding:7px 11px;font-size:.76rem}.price{font-size:2rem;font-weight:800;margin:25px 0}.table{border-top:1px solid var(--line)}.row{display:grid;grid-template-columns:130px 1fr;padding:15px 0;border-bottom:1px solid var(--line)}.row b{color:#fff}.row span{color:#c6ccd4}.note{color:var(--muted);line-height:1.85;margin:24px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{padding:16px;text-align:center;border:1px solid var(--line);font-weight:800}.btn.primary{background:var(--blue);border-color:#4ba8ef}.dummy{margin-top:20px;color:#e5c978;border:1px solid rgba(229,201,120,.4);padding:10px;font-size:.78rem}@media(max-width:760px){.wrap{width:calc(100% - 28px)}.logo{width:190px}.grid{grid-template-columns:1fr;gap:28px}.visual{min-height:300px}.actions{grid-template-columns:1fr}.row{grid-template-columns:100px 1fr}}

.gallery{display:flex;flex-direction:column;gap:12px}
.visual{min-height:430px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.thumb{height:90px;border:1px solid var(--line);background:#0a0d11;padding:0;cursor:pointer;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;opacity:.72;transition:.2s}
.thumb:hover img,.thumb.active img{opacity:1}
.thumb.active{border-color:#fff}
.location-badge{display:inline-block;margin-left:8px;color:#c7ced6;font-size:.78rem}
@media(max-width:760px){.thumb{height:66px}.visual{min-height:280px}}

</style></head><body><header><div class="wrap head"><a href="index.html"><img class="logo" src="renvis-logo.png" alt="RENVIS"></a><a class="back" href="used-sales.html">一覧へ戻る</a></div></header><main><div class="wrap"><div class="grid"><div class="gallery"><div class="visual" id="visual"></div><div class="thumbs" id="thumbs"></div></div><div><div class="eyebrow" id="maker"></div><h1 id="model"></h1><span class="status" id="status"></span><div class="price" id="price"></div><div class="table" id="table"></div><p class="note">商品状態・付属品・整備内容など、詳細はお問い合わせください。</p><div class="actions"><a class="btn primary" href="tel:0946428311">電話で問い合わせる</a><a class="btn" href="used-sales.html">中古商品一覧へ</a></div></div></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(async()=>{
  const id=Number(new URLSearchParams(location.search).get("id")||0);
  const cfg=window.RENVIS_SUPABASE;
  const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const yen=n=>Number.isFinite(Number(n))?Number(n).toLocaleString("ja-JP")+"円（税込）":"価格応相談";
  if(!id||!cfg?.url||!cfg?.key){ document.getElementById("model").textContent="商品情報を取得できません"; return; }
  try{
    const db=window.supabase.createClient(cfg.url,cfg.key);
    const [{data:item,error:itemErr},{data:images,error:imgErr}]=await Promise.all([
      db.from("used_items").select("*").eq("id",id).eq("is_public",true).maybeSingle(),
      db.from("used_item_images").select("*").eq("used_item_id",id).order("sort_order",{ascending:true}).order("id",{ascending:true})
    ]);
    if(itemErr) throw itemErr; if(imgErr) throw imgErr; if(!item) throw new Error("not found");
    const title=item.model||item.title||`中古商品 ${item.id}`;
    document.title=title+" | RENVIS";
    document.getElementById("maker").textContent=item.maker||"";
    document.getElementById("model").textContent=title;
    document.getElementById("status").textContent=item.status||"販売中";
    document.getElementById("price").textContent=yen(item.price);
    const gallery=[...(images||[]).map(x=>x.image_url).filter(Boolean)];
    if(!gallery.length && item.thumbnail_url) gallery.push(item.thumbnail_url);
    const visual=document.getElementById("visual"), thumbs=document.getElementById("thumbs");
    if(gallery.length){
      visual.innerHTML=`<img id="mainImage" src="${esc(gallery[0])}" alt="${esc(title)}">`;
      thumbs.innerHTML=gallery.map((src,i)=>`<button class="thumb ${i===0?"active":""}" type="button" data-src="${esc(src)}"><img src="${esc(src)}" alt=""></button>`).join("");
      thumbs.addEventListener("click",e=>{ const btn=e.target.closest(".thumb"); if(!btn)return; document.getElementById("mainImage").src=btn.dataset.src; thumbs.querySelectorAll(".thumb").forEach(x=>x.classList.remove("active")); btn.classList.add("active"); });
    }else{ visual.innerHTML='<span class="no-photo">NO PHOTO</span>'; }
    const rows=[
      ["メーカー",item.maker],["種類",item.type],["型式",item.model],["対応クラス",item.cls],
      ["年式",item.year?item.year+"年":""],["販売状況",item.status||"販売中"],["商品状態",item.condition],["所在地","福岡県"]
    ].filter(([,v])=>v!==null&&v!==undefined&&String(v)!=="");
    document.getElementById("table").innerHTML=rows.map(([k,v])=>`<div class="row"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("");
    if(item.description){ document.querySelector(".note").textContent=item.description; }
  }catch(err){
    console.error("used detail load error",err);
    document.getElementById("model").textContent="商品情報を取得できません";
    document.getElementById("visual").innerHTML='<span class="no-photo">NO DATA</span>';
  }
})();
</script></body></html>
